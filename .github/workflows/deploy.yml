name: Deploy (Production)

on: workflow_dispatch

env:
  SSH_AUTH_SOCK: /tmp/ssh-agent.sock

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: p3k.org
      url: https://p3k.org/rss

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup SSH agent
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          mkdir -p ~/.ssh
          echo '${{ vars.SSH_CONFIG }}' > ~/.ssh/config
          echo '${{ vars.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

      - name: Verify deploy.sh on the server is current
        run: |
          expected=$(sha256sum deploy.sh | cut -d ' ' -f 1)
          actual=$(ssh rss-box version)
          if test "$actual" != "$expected"; then
            echo "deploy.sh on the server (sha256 $actual) doesn't match this repo's copy ($expected)." >&2
            echo "On the server, run:" >&2
            echo "  curl -sO https://raw.githubusercontent.com/p3k/rss-box/main/deploy.sh && chmod +x deploy.sh" >&2
            exit 1
          fi

      - name: Copy files from stage to production
        run: ssh rss-box deploy

