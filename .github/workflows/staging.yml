name: Deploy (Stage)

on:
  push:
    branches:
      - "main"

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: stage
      url: ${{ vars.BASE_URL }}/rss-staging

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Configure environment
      run: |
        cat << .end > src/local.js
          export const urls = {
            app: "${{ vars.BASE_URL }}/rss-staging",
            proxy: "${{ vars.BASE_URL }}/json/roxy",
            referrers: "${{ vars.BASE_URL }}/json/ferris?group=rss-box"
          };
        .end

    # Neither of these needs SSH access. Keeping them as their own steps,
    # before the SSH agent below even starts, means a compromised npm
    # dependency running here has no way to reach the deploy key at all.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Bump version number
      run: |
        date=$(date +"%y.%-m.%-d")
        jq < package.json | jq ".version |= \"$date\"" > package.json.tmp
        mv package.json.tmp package.json

    - name: Check whether the services submodule changed
      id: services
      run: |
        if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx services; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup SSH agent
      run: |
        ssh-agent -a /tmp/ssh-agent.sock > /dev/null
        echo "SSH_AUTH_SOCK=/tmp/ssh-agent.sock" >> "$GITHUB_ENV"
        ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
        mkdir -p ~/.ssh
        echo '${{ vars.SSH_CONFIG }}' > ~/.ssh/config
        echo '${{ vars.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

    - name: Publish to staging environment
      run: rsync --archive --del --exclude .ssh --info=stats dist/ -- rss-box:/

    - name: Publish services
      if: steps.services.outputs.changed == 'true'
      run: |
        # .entrecote holds the live referrer database — never sync over it.
        # The services-update/ destination (vs. the frontend's plain "/")
        # is how deploy.sh on the server tells the two apart.
        rsync --archive --del --info=stats \
          --exclude .git --exclude .github --exclude .venv \
          --exclude __pycache__ --exclude .entrecote \
          services/ -- rss-box:services-update/
        ssh rss-box deploy-services
