name: Deploy (Stage)

on:
  push:
    branches:
      - "main"

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: stage
      url: ${{ vars.BASE_URL }}/rss-staging

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Configure environment
      run: |
        cat << .end > src/local.js
          // Keep the days value here equal to referrerDays in src/urls.js –
          // this whole file replaces that module’s urls export wholesale
          // rather than merging into it, so its own default query param
          // never reaches a deployed build otherwise
          export const urls = {
            app: "${{ vars.BASE_URL }}/rss-staging",
            proxy: "${{ vars.BASE_URL }}/json/roxy",
            referrers: "${{ vars.BASE_URL }}/json/ferris?group=rss-box&days=30"
          };
        .end

    # Neither of these needs SSH access. Keeping them as their own steps,
    # before the SSH agent below even starts, means a compromised npm
    # dependency running here has no way to reach the deploy key at all.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Bump version number
      run: |
        date=$(date +"%y.%-m.%-d")
        jq < package.json | jq ".version |= \"$date\"" > package.json.tmp
        mv package.json.tmp package.json

    - name: Setup SSH agent
      run: |
        export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
        ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
        mkdir -p ~/.ssh
        echo '${{ vars.SSH_CONFIG }}' > ~/.ssh/config
        echo '${{ vars.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

    # Compares against what the server actually has deployed, not against
    # the previous push – a git-diff-based check would look at
    # github.event.before, which already includes the submodule bump the
    # moment it lands on main, regardless of whether the deploy afterward
    # actually succeeded. A failed deploy would then go unnoticed and
    # never get retried by any later, unrelated push.
    - name: Check whether services needs a fresh deploy
      id: services
      run: |
        local_revision=$(git -C services rev-parse HEAD)
        remote_revision=$(ssh rss-box services-version || true)
        if test "$local_revision" != "$remote_revision"; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish to staging environment
      run: rsync --archive --del --exclude .ssh --info=stats dist/ -- rss-box:/

    # npm run deploy:services checks this itself now (predeploy:services
    # runs verify-deploy-sh.sh), so this no longer needs its own step –
    # manual deploys go through the exact same check this way, too.
    - name: Publish services
      if: steps.services.outputs.changed == 'true'
      run: |
        # Travels along in the same rsync payload, ends up inside the
        # live services/ directory after deploy-services swaps it in –
        # that’s what the check above reads back next time
        git -C services rev-parse HEAD > services/.rss-box-services-revision
        npm run deploy:services
