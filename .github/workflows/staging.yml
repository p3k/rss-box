name: Deploy (Stage)

on:
  push:
    branches:
      - "main"

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: stage
      url: ${{ vars.BASE_URL }}/rss-staging

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Configure environment
      run: |
        cat << .end > src/local.js
          // Keep the days value here equal to referrerDays in src/urls.js —
          // this whole file replaces that module's urls export wholesale
          // rather than merging into it, so its own default query param
          // never reaches a deployed build otherwise
          export const urls = {
            app: "${{ vars.BASE_URL }}/rss-staging",
            proxy: "${{ vars.BASE_URL }}/json/roxy",
            referrers: "${{ vars.BASE_URL }}/json/ferris?group=rss-box&days=30"
          };
        .end

    # Neither of these needs SSH access. Keeping them as their own steps,
    # before the SSH agent below even starts, means a compromised npm
    # dependency running here has no way to reach the deploy key at all.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build

    - name: Bump version number
      run: |
        date=$(date +"%y.%-m.%-d")
        jq < package.json | jq ".version |= \"$date\"" > package.json.tmp
        mv package.json.tmp package.json

    - name: Check whether the services submodule changed
      id: services
      run: |
        if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx services; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup SSH agent
      run: |
        export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
        ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
        mkdir -p ~/.ssh
        echo '${{ vars.SSH_CONFIG }}' > ~/.ssh/config
        echo '${{ vars.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

    - name: Publish to staging environment
      run: rsync --archive --del --exclude .ssh --info=stats dist/ -- rss-box:/

    - name: Verify deploy.sh on the server is current
      if: steps.services.outputs.changed == 'true'
      run: |
        expected=$(sha256sum deploy.sh | cut -d ' ' -f 1)
        actual=$(ssh rss-box version)
        if test "$actual" != "$expected"; then
          echo "deploy.sh on the server (sha256 $actual) doesn't match this repo's copy ($expected)." >&2
          echo "On the server, run:" >&2
          echo "  curl -sO https://raw.githubusercontent.com/p3k/rss-box/main/deploy.sh && chmod +x deploy.sh" >&2
          exit 1
        fi

    - name: Publish services
      if: steps.services.outputs.changed == 'true'
      run: npm run deploy:services
