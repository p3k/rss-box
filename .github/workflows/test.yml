name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm run install:local
          npm run install:environment

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
