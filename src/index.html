<style>
  /* Loading a different feed into the box can change its height
     substantially, which shrinks the whole page. Without this, the
     browser’s own scroll anchoring reacts by shifting the scroll
     position to compensate, which can feel like the page jumping
     around on its own whenever a referrer’s feed changes */
  html,
  body {
    overflow-anchor: none;
  }

  body {
    margin: 0 1%;
    background-color: #fff;
  }

  a {
    text-decoration: none;
  }

  a[href]:hover {
    text-decoration: underline;
  }

  /* Fix the min.css button size */
  .btn {
    font-size: 14px;
  }
</style>

<main>
  <noscript>
    <h1>
      Sorry, this web page needs JavaScript to be enabled in your browser.
    </h1>
  </noscript>
</main>

<!-- Load the polyfills for IE 11 and other older browsers. nomodule is
     ignored by any browser that doesn’t understand it (IE 11 included),
     which loads this normally – module-aware browsers skip it entirely,
     since they don’t need any of it -->
<script nomodule src="./polyfills.js"></script>
<script src="./app.js" async defer></script>
